name: Build APK

on:
  push:
    branches:
      - main
      - ci
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk        artifact/
          cp qqmusic/build/outputs/apk/debug/qqmusic-debug.apk   artifact/
          cp kugoumusic/build/outputs/apk/debug/kugoumusic-debug.apk artifact/
          ls -la artifact

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudmusic-car-debug-${{ github.sha }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 14
